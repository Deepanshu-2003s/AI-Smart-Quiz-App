<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Smart Quiz</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- Landing Page -->
  <div id="home">
    <h1>🧠 AI Smart Quiz</h1>
    <p>Test your knowledge with smart AI-driven quizzes</p>

    <select id="category">
      <option value="18">Programming</option>
      <option value="9">General Knowledge</option>
    </select>

    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>

    <button onclick="startQuiz()">Start Quiz</button>
    <button onclick="toggleTheme()">🌙 Toggle Theme</button>
  </div>

  <!-- Quiz Section -->
  <div id="quiz-box" class="hidden">

    <div class="progress">
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <p id="timer">Time: 10</p>
    <h2 id="question"></h2>
    <div id="options"></div>

  </div>

  <!-- Result -->
  <div id="result-box" class="hidden">
    <h2 id="score"></h2>
    <p id="feedback"></p>

    <canvas id="scoreChart" width="150" height="150"></canvas>

    <input type="text" id="username" placeholder="Enter your name">
    <button onclick="saveResult()">Save Score</button>
    <button onclick="showLeaderboard()">Leaderboard</button>
  </div>

  <!-- Leaderboard -->
  <div id="leaderboard"></div>

</div>

<!-- Sounds -->
<audio id="correctSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>
<audio id="wrongSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
